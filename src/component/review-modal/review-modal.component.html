<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 text-primary">
  <div class="bg-white rounded-lg w-full max-w-lg p-6 relative">
    <button
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
      (click)="close()">
      <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <h2 class="text-xl font-semibold text-gray-800 mb-4">Valorar tu experiencia</h2>

    <div class="mb-4">
      <label for="rating" class="block text-sm font-medium text-gray-700">Tu valoración:</label>
      <select id="rating" [(ngModel)]="rating" class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="1">1 - Muy malo</option>
        <option value="2">2 - Malo</option>
        <option value="3">3 - Regular</option>
        <option value="4">4 - Bueno</option>
        <option value="5">5 - Excelente</option>
      </select>
    </div>

    <div class="flex justify-end gap-4">
      <button
        (click)="submitReview()"
        class="text-secondary bg-primary py-1 px-4 rounded-md hover:bg-primary-light hover:text-secondary transition duration-300">
        Enviar valoración
      </button>
      <button
        (click)="close()"
        class="text-primary bg-secondary py-1 px-4 rounded-md hover:bg-primary-light hover:text-secondary transition duration-300">
        Cancelar
      </button>
    </div>
  </div>
</div>
